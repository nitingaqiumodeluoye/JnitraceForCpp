name: Build

on:
  push:
    branches: [ main, master ]
    tags-ignore: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 25.2.9519653
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      # 不使用 android-actions/setup-android:它会执行已经被移除的 `sdkmanager tools` 而失败。
      # runner 镜像里已经预装了 Android SDK,直接用它的 sdkmanager 装需要的东西即可。
      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          echo "sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" --install             "ndk;${NDK_VERSION}"             "cmake;${CMAKE_VERSION}"             "platforms;android-33"             "build-tools;30.0.3"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          ls "${ANDROID_SDK_ROOT}/ndk"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug apk
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          # 同一个so在每个ABI的obj目录下都有一份,直接cp会互相覆盖,按ABI重命名
          while IFS= read -r so; do
            abi="$(basename "$(dirname "$so")")"
            cp "$so" "artifacts/libjnitrace-${abi}.so"
          done < <(find app/build/intermediates -path "*/obj/*" -name "libjnitrace.so")
          ls -lh artifacts

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: jnitrace-debug-apk
          path: artifacts/
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
            **/build/reports/
          if-no-files-found: ignore
